# docker-compose.initial-cert.yml template
# Minimal nginx that serves only ACME HTTP-01 challenges, for first-time cert
# issuance — before the full stack (which needs a cert to start) can come up.
#
# The full stack's docker-compose.prod.yml carries the same `name:` and volume names,
# so both share certbot-challenges and letsencrypt.
# See scripts/prod-init.sh for the automated flow.

name: myapp # must equal `name:` in docker-compose.prod.yml

services:
  # ── Reverse Proxy (ACME challenge only, no TLS) ──
  reverse-proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.initial-cert.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app-network

volumes:
  certbot-challenges:
  letsencrypt:

networks:
  app-network:
    driver: bridge
