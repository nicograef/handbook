# docker-compose.initial-cert.yml template
# Minimal nginx that serves only ACME HTTP-01 challenges, for first-time cert
# issuance — before the full stack (which needs a cert to start) can come up.
#
# The full stack's docker-compose.prod.yml reuses the same volume names, so run
# both under one Compose project (-p) to share certbot-challenges and letsencrypt.
#
# Usage:
#   1. Copy templates/nginx-initial-cert.conf to reverse-proxy/nginx.initial-cert.conf
#   2. docker compose -p <project> -f docker-compose.initial-cert.yml up -d
#   3. Request the cert, then tear this down and start docker-compose.prod.yml
#   See scripts/prod-init.sh for the automated flow.

services:
  # ── Reverse Proxy (ACME challenge only, no TLS) ──
  reverse-proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.initial-cert.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app-network

volumes:
  certbot-challenges:
  letsencrypt:

networks:
  app-network:
    driver: bridge
