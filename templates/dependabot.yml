# Dependabot template – copy to .github/dependabot.yml
# Monthly + grouped: one batched PR per ecosystem instead of per-dependency noise.
# Each stack's ecosystem sits between `# >>> stack: NAME` and `# <<< stack: NAME` lines, as in
# ci.yml; delete the stacks your project lacks.
# The github-actions updater also keeps pinned action refs from rotting.
version: 2
updates:
  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # >>> stack: go
  # ── Go modules ──
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      gomod:
        patterns:
          - "*"
  # <<< stack: go

  # >>> stack: frontend
  # ── npm / pnpm ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"
  # <<< stack: frontend

  # >>> stack: python
  # ── Python (uv: pyproject.toml + uv.lock) ──
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      uv:
        patterns:
          - "*"
  # <<< stack: python

  # ── Docker Compose service images ──
  # The docker ecosystem parses Dockerfiles only, so compose image tags need this entry.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns:
          - "*"

  # ── Docker base images ──
  # Covers Dockerfiles and Kubernetes manifests; enable when a Dockerfile pins a base image.
  # - package-ecosystem: "docker"
  #   directory: "/backend" # one entry per directory containing a Dockerfile
  #   schedule:
  #     interval: "monthly"
  #   groups:
  #     docker:
  #       patterns:
  #         - "*"
