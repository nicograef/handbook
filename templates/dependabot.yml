# Monthly + grouped: one batched PR per ecosystem instead of per-dependency noise.
version: 2
updates:
  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # >>> stack: go
  # ── Go modules ──
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      gomod:
        patterns:
          - "*"

  # ── Docker base images (backend/Dockerfile) ──
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      docker-backend:
        patterns:
          - "*"
  # <<< stack: go

  # >>> stack: frontend
  # ── npm / pnpm ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  # ── Docker base images (frontend/Dockerfile) ──
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      docker-frontend:
        patterns:
          - "*"
  # <<< stack: frontend

  # >>> stack: python
  # ── Python (uv: pyproject.toml + uv.lock) ──
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      uv:
        patterns:
          - "*"

  # ── Docker base images (backend/Dockerfile) ──
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      docker-backend:
        patterns:
          - "*"
  # <<< stack: python

  # ── Docker Compose service images ──
  # The docker ecosystem parses Dockerfiles only, so compose image tags need this entry.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns:
          - "*"
