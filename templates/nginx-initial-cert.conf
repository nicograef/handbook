# nginx-initial-cert.conf — Catch-all HTTP server for first-time cert issuance
# Copy to reverse-proxy/nginx.initial-cert.conf on the server. No domain edit needed:
# `default_server` handles every Host on port 80, so the ACME HTTP-01 challenge is
# served for any domain. Swap to nginx-tls.conf once the certificate exists.

server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}
