# All jobs are active. Delete the ones you don't need.
# Search for <angle-bracket> placeholders and adapt to your project.
# Validate locally before pushing: actionlint .github/workflows/ci.yml
#
# Every `uses:` is pinned to a full commit SHA, with the release it stood for in the
# trailing comment. A tag is mutable: whoever controls the upstream repository can
# repoint it and every run picks that up silently. Dependabot's github-actions group
# rewrites SHA and comment together, so the pins still get bumped.
#
# `timeout-minutes` on every job: GitHub's default is six hours. The values here are
# placeholders; read the real figure off `gh run view <id> --json jobs` and set each
# well above it.
name: CI

# Every push on any branch, so a feature branch is measured while it is still a branch.
# No pull_request trigger: it would run a second time on the same commit.
on:
  push:
    branches: ['**']

# Least-privilege token; a job that needs more (e.g. OIDC deploy) requests
# its scopes at job level (id-token: write, contents: read).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change Detection ───────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            database:
              - 'database/**'

  # ── Go Backend ─────────────────────────────────────────────────────────────
  backend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./<backend-dir>  # e.g. ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only for a diff-scoped lint (one that reads `git diff <base>..HEAD`): a shallow
          # clone carries no merge base, the diff reads as empty, and the gate is green for
          # the one reason a gate may never be green.
          # fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"  # match your go.mod version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Fails if go.mod/go.sum drift from the source (edited without re-tidying).
      - name: Verify go.mod/go.sum are tidy
        run: go mod tidy -diff

      # goimports is a go.mod tool: `go get -tool golang.org/x/tools/cmd/goimports`.
      - name: Check format
        run: |
          UNFORMATTED="$(go tool goimports -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Code is not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      # Reports only — add a threshold comparison here to make it a gate.
      - name: Report test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

  # ── golangci-lint (separate job for caching) ───────────────────────────────
  backend-golangci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./<backend-dir>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2  # keep in sync with scripts/setup-dev-tools.sh
          working-directory: ./<backend-dir>

  # ── Node / pnpm Frontend ──────────────────────────────────────────────────
  frontend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./<frontend-dir>  # e.g. ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pnpm reads its version from the packageManager field.
          package_json_file: <frontend-dir>/package.json  # relative to the repo root
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26  # match your .node-version or package.json engines
          cache: "pnpm"
          cache-dependency-path: <frontend-dir>/pnpm-lock.yaml  # e.g. frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # ── Python Backend (uv) ───────────────────────────────────────────────────
  backend-python-ci:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./<backend-dir>  # e.g. ./backend, or . for a root pyproject.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-uv publishes no floating tag since v8, so an exact release or a SHA is the only pin.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"

      # --locked fails when uv.lock no longer matches pyproject.toml.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check .

      - name: Test
        run: uv run pytest

      # Last: the only step that queries a remote advisory service.
      - name: Audit
        run: uv audit

  # ── Integration Tests (Go + PostgreSQL) ────────────────────────────────────
  backend-integration-tests:
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true') || (needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: <database-name>  # e.g. myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./<backend-dir>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      # The digest is the release's sha256sum.txt entry; update it together with the version.
      - name: Install golang-migrate
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo migrate.tar.gz "https://github.com/golang-migrate/migrate/releases/download/v4.20.1/migrate.linux-amd64.tar.gz"
          echo "b1e13121d4178b7804a9fb29dca62d57b732390f7e5ae33f2cd65e9b192e1bd4  migrate.tar.gz" | sha256sum -c -
          sudo tar -xzf migrate.tar.gz -C /usr/local/bin migrate

      - name: Run database migrations up
        working-directory: ./<database-dir>  # e.g. ./database
        run: migrate -path ./migrations -database "postgres://admin:admin@localhost:5432/<database-name>?sslmode=disable" up

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DBNAME: <database-name>  # match POSTGRES_DB above
          # JWT_SECRET: test-secret  # uncomment and add secrets your app needs
        run: go test -tags=integration -v -race ./...

      - name: Run database migrations down
        if: always()
        working-directory: ./<database-dir>
        run: migrate -path ./migrations -database "postgres://admin:admin@localhost:5432/<database-name>?sslmode=disable" down -all
