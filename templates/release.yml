# Copy to .github/workflows/release.yml and replace the <angle-bracket> placeholders.
# A vX.Y.Z tag (`make prod-release VERSION=X.Y.Z`) builds the app images and pushes them to
# GHCR under that tag; docker-compose.prod.yml pins the same tag. The tag goes on a main commit
# CI already checked, so this workflow runs no tests.
#
# Every `uses:` is pinned to a full commit SHA, with its release in the trailing comment (see ci.yml).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Releases queue instead of cancelling a half-pushed set of images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # One entry per app image in docker-compose.prod.yml, with its build context.
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/<owner>/<project>-${{ matrix.service }}:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
