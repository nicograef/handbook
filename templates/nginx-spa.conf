# nginx-spa.conf — SPA container config: client-side routing + asset caching
# Copy to nginx.conf at the app repo root (see the Node.js stage in
# guides/docker-multi-stage-builds.md, which COPYs it into the runtime image).
# Not in the reverse-proxy template — these two patterns belong to the frontend
# nginx that serves the SPA directly.

location / {
  root /usr/share/nginx/html;
  try_files $uri $uri/ /index.html;
}

location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri $uri/ =404;
}
