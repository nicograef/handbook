# nginx-spa.conf — SPA container config: client-side routing + asset caching
# Paste these lines into the `server` block of the frontend nginx config: the
# nginx.conf that the Node.js stage in guides/docker-multi-stage-builds.md COPYs
# to /etc/nginx/conf.d/default.conf. Bare location blocks are not a valid conf.d
# file on their own. They are not in the reverse-proxy template; they belong to
# the frontend nginx that serves the SPA directly.

root /usr/share/nginx/html;

location / {
  try_files $uri $uri/ /index.html;
}

# Build output under /assets/ has content-hashed file names, so a file never changes.
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# Every route falls back to index.html; revalidating it lets a deploy reach clients at once.
location = /index.html {
  add_header Cache-Control "no-cache";
}
