# nginx-spa.conf — SPA container config: client-side routing + asset caching
# Paste both blocks into the `server` block of the frontend nginx config: the
# nginx.conf that the Node.js stage in guides/docker-multi-stage-builds.md COPYs
# to /etc/nginx/conf.d/default.conf. Bare location blocks are not a valid conf.d
# file on their own. They are not in the reverse-proxy template; they belong to
# the frontend nginx that serves the SPA directly.

location / {
  root /usr/share/nginx/html;
  try_files $uri $uri/ /index.html;
}

location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri $uri/ =404;
}
