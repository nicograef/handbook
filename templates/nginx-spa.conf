# nginx-spa.conf — SPA container config: client-side routing + asset caching
# Copy to <frontend-dir>/nginx.conf; Dockerfile.spa COPYs it to /etc/nginx/conf.d/default.conf.
# It serves the built SPA inside the frontend container. TLS and routing to the backend
# belong to the reverse proxy in front of it, not here.

server {
  # IPv4 only: the proxy reaches the container over the Compose network, and a
  # container without IPv6 would refuse to start on a [::] listen.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build output under /assets/ has content-hashed file names, so a file never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every route falls back to index.html; revalidating it lets a deploy reach clients at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
