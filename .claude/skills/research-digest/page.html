<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A newsletter: a sticky contents rail beside one reading column. The report's h1 and first paragraph form the masthead;
   the paragraph right after a story headline is its source line. */
:root {
  --bg: #f4f2ee; --surface: #fffdf9; --code-bg: #e9e5dd; --fg: #1d2226; --muted: #5d6870; --rule: #d9d3c8;
  --accent: #1f5f8b; --callout: #e6eef4;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13181c; --surface: #1a2127; --code-bg: #232c33; --fg: #e4e8ea; --muted: #9aa6ad; --rule: #2c363d;
  --accent: #7cb8e3; --callout: #1a2a35; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #13181c; --surface: #1a2127; --code-bg: #232c33; --fg: #e4e8ea; --muted: #9aa6ad; --rule: #2c363d;
  --accent: #7cb8e3; --callout: #1a2a35; color-scheme: dark;
}
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.65 var(--body); padding: 0 16px 64px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 230px minmax(0, 1fr); column-gap: 56px; }
nav { position: sticky; top: 0; align-self: start; max-height: 100vh; box-sizing: border-box; overflow: auto; padding-block: 48px 24px; font: 14px/1.45 var(--display); }
nav::before { content: "Contents"; display: block; margin-bottom: 12px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
nav li.h2 { font-weight: 500; margin-top: 8px; }
nav li.h3 { padding-left: 14px; font-size: 13px; color: var(--muted); }
nav a { color: inherit; text-decoration: none; }
nav a:hover, nav a:focus-visible { color: var(--accent); text-decoration: underline; }
main { min-width: 0; max-width: 46rem; padding-top: 40px; }
main > h1:first-child { font: 700 clamp(30px, 5vw, 50px)/1.08 var(--display); margin: 0 0 14px; text-wrap: balance; }
main > h1:first-child + p { font-size: 20px; color: var(--muted); margin: 0; }
main h2 { font: 700 27px/1.25 var(--display); margin: 52px 0 18px; padding-top: 14px; border-top: 3px solid var(--fg); text-wrap: balance; }
main h3 { font: 700 21px/1.3 var(--display); margin: 40px 0 6px; text-wrap: balance; }
main h2 + h3 { margin-top: 20px; }
main h3 + p { font: 13px/1.6 var(--mono); color: var(--muted); margin-bottom: 12px; }
main p, main li { margin: 0 0 14px; }
main ul, main ol { padding-left: 1.3em; }
main li::marker { color: var(--accent); }
main a { color: var(--accent); text-underline-offset: 2px; overflow-wrap: anywhere; }
main > p:has(> strong:first-child) { background: var(--callout); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 14px; }
main > p > strong:first-child { font: 700 13px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-right: 4px; }
main strong { font-weight: 600; }
main blockquote { margin: 0 0 14px; padding-left: 16px; border-left: 3px solid var(--rule); color: var(--muted); font-style: italic; }
main code { font: .84em var(--mono); background: var(--code-bg); border-radius: 4px; padding: .05em .3em; overflow-wrap: anywhere; }
main pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
main pre code { background: none; padding: 0; }
main table { display: block; overflow-x: auto; border-collapse: collapse; }
main img { max-width: 100%; }
main hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
@media (max-width: 760px) {
  html { scroll-padding-top: 64px; }
  body { font-size: 17px; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav { z-index: 2; max-height: none; margin-inline: -16px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--rule); overflow-x: auto; }
  nav::before, nav li.h3 { display: none; }
  nav ol { display: flex; gap: 2px; }
  nav li.h2 { margin: 0; }
  nav a { display: flex; align-items: center; min-height: 44px; padding-inline: 10px; white-space: nowrap; }
  main { padding-top: 28px; }
  main h2 { font-size: 23px; }
  main h3 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <nav aria-label="Contents"><ol id="toc"></ol></nav>
  <main id="report-body"></main>
</div>

<script type="application/json" id="report">{{REPORT}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js"></script>
<script>
(function () {
  var md = JSON.parse(document.getElementById('report').textContent);
  var main = document.getElementById('report-body');
  if (!(window.marked && window.DOMPurify)) {
    var pre = document.createElement('pre');
    pre.textContent = md;
    main.appendChild(pre);
    return;
  }
  // Fetched titles and quotes reach the page, so the rendered HTML is sanitised.
  main.innerHTML = DOMPurify.sanitize(marked.parse(md), { FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select'], FORBID_ATTR: ['style'] });
  var toc = document.getElementById('toc'), used = {};
  main.querySelectorAll('h2, h3').forEach(function (h) {
    var label = h.textContent.trim();
    var base = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'section';
    var id = base, i = 2;
    while (used[id] || document.getElementById(id)) id = base + '-' + i++;
    used[id] = 1;
    h.id = id;
    var li = document.createElement('li'), a = document.createElement('a');
    li.className = h.tagName.toLowerCase();
    a.href = '#' + id;
    a.textContent = label;
    li.appendChild(a);
    toc.appendChild(li);
  });
})();
</script>
