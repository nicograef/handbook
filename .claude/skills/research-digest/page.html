<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading column of issue entries with a sticky contents rail on wide screens; the rail folds above the column on phones. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --fg: #1b2328;
  --muted: #5b6870;
  --rule: #d5dde1;
  --accent: #1f5f8b;
  --hi: #b4361f; --hi-bg: #fbe7e2;
  --med: #8a5a00; --med-bg: #fbefd4;
  --low: #3d5a6c; --low-bg: #e3ecf1;
  --none: #6c7378; --none-bg: #eceeef;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181c; --surface: #182128; --fg: #e3e9ec; --muted: #98a6ae; --rule: #2a363e; --accent: #7cb8e3;
  --hi: #f19a86; --hi-bg: #3b221d; --med: #e7bf6a; --med-bg: #362b14; --low: #a9c4d4; --low-bg: #1f2e38; --none: #9aa2a7; --none-bg: #242b30;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12181c; --surface: #182128; --fg: #e3e9ec; --muted: #98a6ae; --rule: #2a363e; --accent: #7cb8e3;
  --hi: #f19a86; --hi-bg: #3b221d; --med: #e7bf6a; --med-bg: #362b14; --low: #a9c4d4; --low-bg: #1f2e38; --none: #9aa2a7; --none-bg: #242b30;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 17px/1.6 var(--body); padding-inline: 16px; padding-block: 0 64px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; }
header.mast { grid-column: 1 / -1; padding-block: 40px 20px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 4.5vw, 44px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.window { font: 500 14px/1.4 var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow: auto; padding-block: 24px; font: 14px/1.45 var(--display); }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
nav.toc li.h3 { padding-left: 12px; font-size: 13px; color: var(--muted); }
nav.toc a { color: inherit; text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); text-decoration: underline; }
main { min-width: 0; padding-block: 24px; max-width: 68ch; }
main h2 { font: 700 24px/1.25 var(--display); margin: 48px 0 12px; padding-top: 12px; border-top: 2px solid var(--fg); text-wrap: balance; }
main h3 { font: 600 19px/1.35 var(--display); margin: 32px 0 6px; text-wrap: balance; }
main h3 + p { font: 13px/1.5 var(--mono); color: var(--muted); }
main p, main li { margin: 0 0 12px; }
main a { color: var(--accent); text-underline-offset: 2px; }
main code { font: 0.86em var(--mono); background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
main pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; overflow-x: auto; }
main pre code { border: 0; padding: 0; }
main blockquote { margin: 0 0 12px; padding-left: 16px; border-left: 3px solid var(--rule); color: var(--muted); }
.table { overflow-x: auto; margin: 0 0 16px; }
main table { border-collapse: collapse; font: 14px/1.45 var(--display); font-variant-numeric: tabular-nums; }
main th, main td { border-bottom: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
main th { font-weight: 600; }
main strong { font-weight: 600; }
.rel { display: inline-block; font: 500 11px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 8px; border-radius: 999px; white-space: nowrap; }
.rel-high { color: var(--hi); background: var(--hi-bg); }
.rel-medium { color: var(--med); background: var(--med-bg); }
.rel-low { color: var(--low); background: var(--low-bg); }
.rel-none { color: var(--none); background: var(--none-bg); }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.toc { position: static; max-height: none; padding-block: 16px 0; border-bottom: 1px solid var(--rule); }
  nav.toc li.h3 { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow">Research digest</div>
    <h1 id="title">{{TITLE}}</h1>
    <div class="window" id="window"></div>
  </header>
  <nav class="toc" aria-label="Contents"><ol id="toc"></ol></nav>
  <main id="issue-body"></main>
</div>

<script type="text/markdown" id="issue">{{ISSUE}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
<script>
(function () {
  var md = document.getElementById('issue').textContent.replace(/<\\\//g, '</');
  var lines = md.split('\n');
  // The issue's own H1 and Window line move into the masthead.
  if (/^# /.test(lines[0])) { document.getElementById('title').textContent = lines.shift().slice(2).trim(); }
  var wi = lines.findIndex(function (l) { return /^Window:/.test(l.trim()); });
  if (wi > -1 && wi < 4) { document.getElementById('window').textContent = lines.splice(wi, 1)[0].trim().replace(' to ', ' → '); }
  var main = document.getElementById('issue-body');
  main.innerHTML = window.marked ? marked.parse(lines.join('\n')) : '<pre>' + lines.join('\n').replace(/[&<]/g, function (c) { return c === '&' ? '&amp;' : '&lt;'; }) + '</pre>';
  main.querySelectorAll('table').forEach(function (t) { var d = document.createElement('div'); d.className = 'table'; t.parentNode.insertBefore(d, t); d.appendChild(t); });
  main.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
  // Relevance labels become chips: "Relevance: low", "relevance high" and the like.
  var walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
  var hits = [], n;
  while ((n = walker.nextNode())) { if (/\b(relevance)\b[:\s*]*\b(high|medium|low|none)\b/i.test(n.nodeValue)) hits.push(n); }
  hits.forEach(function (node) {
    var span = document.createElement('span');
    span.innerHTML = node.nodeValue.replace(/[&<]/g, function (c) { return c === '&' ? '&amp;' : '&lt;'; })
      .replace(/\b(relevance)\b([:\s*]*)\b(high|medium|low|none)\b/ig, function (_, w, sep, lvl) { return w + sep + '<span class="rel rel-' + lvl.toLowerCase() + '">' + lvl + '</span>'; });
    node.parentNode.replaceChild(span, node);
  });
  var toc = document.getElementById('toc'), used = {};
  main.querySelectorAll('h2, h3').forEach(function (h) {
    var base = (h.textContent || 'section').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'section';
    var id = base, i = 2; while (used[id]) id = base + '-' + i++; used[id] = 1; h.id = id;
    var li = document.createElement('li'); li.className = h.tagName.toLowerCase();
    var a = document.createElement('a'); a.href = '#' + id; a.textContent = h.textContent; li.appendChild(a); toc.appendChild(li);
  });
})();
</script>
