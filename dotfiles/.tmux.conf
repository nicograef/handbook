# Start or re-attach a named session per project: tmux new -A -s <project>
# A session outlives logout only with lingering on, which scripts/setup-server.sh enables.

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color for TUIs (Claude Code, lazygit)
set -sg escape-time 10                      # no pause after Esc (vim, Claude Code)
set -sg focus-events on                     # editors reload changed files on focus

# ── Usability ───────────────────────────────────────────────────────────────
set -g mouse on               # wheel scrolls, click selects panes/windows
set -g history-limit 100000   # scrollback lines per pane
set -g base-index 1           # number windows/panes from 1 (matches keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on    # keep numbers gapless after closing a window

# ── Titles ──────────────────────────────────────────────────────────────────
set -g set-titles on
set -g set-titles-string "#{host_short} · #S · #W"
# A Claude Code window takes its task title (with the busy spinner) instead of "claude".
set -g automatic-rename-format "#{?#{==:#{pane_current_command},claude},#{=/32/…:pane_title},#{pane_current_command}}"

# ── Colours: Catppuccin Mocha, backgrounds as dotfiles/ptyxis/*.palette ──────
set -g status-style "bg=#111114,fg=#cdd6f4"
set -g status-left-style "bg=#cba6f7,fg=#0c0c0e,bold"
# The host leads the bar: red on a *prod* host, peach on *staging*, mauve elsewhere.
set -g status-left-length 40
set -g status-left "#{?#{m:*prod*,#{host_short}},#[bg=#f38ba8],#{?#{m:*staging*,#{host_short}},#[bg=#fab387],}} #{host_short} · #S #[default] "
set -g status-right "%a %d %b %H:%M "
set -g window-status-current-style "fg=#cba6f7,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
